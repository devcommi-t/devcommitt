name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static site
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if [ -s CNAME ]; then
            # Custom domain: the site lives at the root of the domain
            BASE=""; SITE_URL="https://$(tr -d '[:space:]' < CNAME)"
          elif [ "$REPO" = "${OWNER}.github.io" ]; then
            BASE=""; SITE_URL="https://${OWNER}.github.io"
          else
            BASE="/$REPO"; SITE_URL="https://${OWNER}.github.io/$REPO"
          fi
          export BASE_PATH="$BASE" SITE_URL
          node build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4